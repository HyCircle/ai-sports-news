<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page_title }}</title>
  <meta name="description" content="每日自动聚合 MLB、NFL、F1、足球、NBA 核心体育新闻中文日报">
  <link rel="alternate" type="application/rss+xml" title="spnews 体育日报 RSS" href="/rss.xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/assets/style.css">
  <script>
    (function () {
      var saved = localStorage.getItem("spnews-theme");
      if (saved === "dark" || (!saved && window.matchMedia("(prefers-color-scheme: dark)").matches)) {
        document.documentElement.setAttribute("data-theme", "dark");
      }
    })();
  </script>
</head>
<body>
  <div class="shell">
    <header class="masthead">
      <div class="masthead-top">
        <a class="brand" href="/">
          <span class="brand-name">spnews</span>
          <span class="brand-sub">每日体育简报</span>
        </a>
        <nav class="top-nav" aria-label="Primary">
          <a href="/" {% if active_nav == 'home' %}aria-current="page"{% endif %}>今日</a>
          <a href="/archives/" {% if active_nav == 'archives' %}aria-current="page"{% endif %}>归档{% if total_reports %} ({{ total_reports }}){% endif %}</a>
          <a href="/rss.xml">RSS</a>
          <a href="https://yhao.dev" target="_blank" rel="noopener">yhao.dev ↗</a>
          <button type="button" class="theme-btn" id="theme-toggle" aria-label="切换深浅色主题">◐</button>
        </nav>
      </div>
    </header>

    <main id="main">
      {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
      <p>
        <span>spnews · MLB · NFL · F1 · 足球 · NBA</span>
        <span class="sep">·</span>
        <a href="/rss.xml">RSS 订阅</a>
        <span class="sep">·</span>
        <a href="/data/latest.json">JSON</a>
        <span class="sep">·</span>
        <a href="https://yhao.dev" target="_blank" rel="noopener">yhao.dev</a>
      </p>
      <p class="disclaimer">由多源 RSS 自动聚合、向量聚类与 AI 撰写，仅供参考；事实细节请以各事件附带的原文链接为准。</p>
    </footer>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
